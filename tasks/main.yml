---

- name: Set platform/version specific variables
  include_tasks: tasks/set_vars.yml

- name: Validate role parameters
  ansible.builtin.include_tasks: assert_role_vars.yml

- name: Ensure required packages are installed
  package:
    name: "{{ __keylime_server_packages }}"
    state: present
    use: "{{ (__keylime_server_is_ostree | d(false)) |
             ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  register: __keylime_server_package_result

# A staged install reports ok on re-runs, so ask rpm (by provides) if it is live.
- name: Check whether the packages are live on a transactional update system
  command:  # noqa command-instead-of-module
    argv: "{{ ['rpm', '-q', '--whatprovides'] + __keylime_server_packages }}"
  register: __keylime_server_packages_live
  changed_when: false
  failed_when: false
  check_mode: false
  when: __keylime_server_is_transactional | d(false)

- name: Handle reboot for transactional update systems
  when:
    - __keylime_server_is_transactional | d(false)
    - __keylime_server_package_result is changed or
      (__keylime_server_packages_live.rc | d(0)) != 0
  block:
    - name: Notify user that reboot is needed to apply changes
      debug:
        msg: >
          Reboot required to apply changes due to transactional updates.

    - name: Reboot transactional update systems
      reboot:
        msg: Rebooting the system to apply transactional update changes.
      when:
        - keylime_server_transactional_update_reboot_ok is not none
        - keylime_server_transactional_update_reboot_ok | bool

    - name: Fail if reboot is needed and not set
      fail:
        msg: >
          Reboot is required but not allowed. Please set 'keylime_server_transactional_update_reboot_ok' to proceed.
      when:
        - keylime_server_transactional_update_reboot_ok is none

- name: Generate keylime legacy configuration
  template:
    src: keylime.conf.j2
    dest: /etc/keylime.conf
    backup: false
    mode: "0600"
    owner: "{{ __keylime_server_user }}"
    group: "{{ __keylime_server_group }}"
  notify: Restart services
  when: __keylime_server_legacy_config | bool

- name: Generate keylime configuration
  include_tasks: keylime-config.yml
  when: not __keylime_server_legacy_config

- name: Ensure the verifier is enabled and started
  service:
    name: "{{ __keylime_server_verifier_service }}"
    state: started
    enabled: true

- name: Make sure the verifier is up and running
  ansible.builtin.wait_for:
    host: "{{ keylime_server_verifier_ip }}"
    port: "{{ keylime_server_verifier_port }}"
    timeout: "{{ __keylime_service_timeout }}"

- name: Ensure the registrar is enabled and started
  service:
    name: "{{ __keylime_server_registrar_service }}"
    state: started
    enabled: true

- name: Make sure the registrar is up and running
  ansible.builtin.wait_for:
    host: "{{ keylime_server_registrar_ip }}"
    port: "{{ keylime_server_registrar_port }}"
    timeout: "{{ __keylime_service_timeout }}"

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: keylime_server
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __keylime_server_write_log_file }}"
